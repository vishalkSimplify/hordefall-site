<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hordefall</title>
<meta name="description" content="Hordefall, a crowd-runner shooter for Android by Fogbank Games.">
<style>
  :root {
    --bg: #fbfaf7;
    --fg: #1d1f21;
    --muted: #5b6066;
    --link: #0b5cad;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141618;
      --fg: #e6e4df;
      --muted: #a2a6ab;
      --link: #7ab4f5;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main {
    max-width: 42rem;
    margin: 0 auto;
    padding: 4rem 16px 3rem;
  }
  h1 { font-size: 2.4rem; line-height: 1.15; margin: 0 0 0.5rem; }
  p { margin: 0 0 1rem; }
  .tagline { font-size: 1.15rem; color: var(--muted); }
  a { color: var(--link); }
  footer { color: var(--muted); font-size: 0.95rem; margin-top: 3rem; }
</style>
</head>
<body>
<main>
  <h1>Hordefall</h1>
  <p class="tagline">A crowd-runner shooter for Android</p>
  <p><a href="privacy.html">Privacy Policy</a></p>
  <footer>
    <p>&copy; 2026 Fogbank Games</p>
  </footer>
</main>
</body>
</html>
